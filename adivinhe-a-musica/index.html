<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
  /* Layout: uma coluna estreita — pulseira de contas no topo, depois um cartão de pista por vez; a cor de cada era vira o destaque */
  :root {
    --bg: #f5f0f6;
    --surface: #fffcfd;
    --soft: #f3ebf4;
    --ink: #2a1c31;
    --muted: #74647c;
    --line: #e2d6e6;
    --accent: #b8306f;
    --on-accent: #ffffff;
    --ok: #1d8a52;
    --bad: #c43c3c;
    --shadow: 0 10px 30px rgba(70, 30, 80, .08);
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #150f18; --surface: #211829; --soft: #2a2032; --ink: #f4eaf6; --muted: #ad9db5;
      --line: #3a2d43; --accent: #ff7cb8; --on-accent: #2a0f1d; --ok: #4fd08b; --bad: #ff8080;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #150f18; --surface: #211829; --soft: #2a2032; --ink: #f4eaf6; --muted: #ad9db5;
    --line: #3a2d43; --accent: #ff7cb8; --on-accent: #2a0f1d; --ok: #4fd08b; --bad: #ff8080;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 600px; margin-inline: auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 20px; }
  .stack { display: grid; gap: 20px; }
  .back { justify-self: start; font-weight: 700; font-size: .9rem; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--accent); }
  .back:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h2 { font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Contas da pulseira */
  .bracelet { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; }
  .word { position: relative; display: inline-flex; gap: .2em; }
  .word::before { content: ""; position: absolute; left: -.4em; right: -.4em; top: 50%; height: 2px; background: var(--line); }
  .bead {
    position: relative; width: 2.05em; height: 2.05em; display: grid; place-items: center;
    border-radius: 32%; font-family: var(--display); font-weight: 700; line-height: 1;
    background: var(--c); color: var(--t);
    border: 1px solid rgba(0, 0, 0, .14);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .16), inset 0 2px 0 rgba(255, 255, 255, .35);
    animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(var(--d, 0) * 35ms);
  }
  @keyframes pop { from { transform: scale(.4) rotate(-12deg); } }
  .hero { font-size: clamp(14px, 4.4vw, 21px); padding-block: 6px; }
  .tagline { text-align: center; color: var(--muted); max-width: 46ch; margin-inline: auto; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 16px; }
  .label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* Escolha de eras */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    padding: 7px 12px 7px 9px; border-radius: 999px; font-weight: 600; font-size: .9rem;
    background: var(--surface); border: 1.5px solid var(--line);
  }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 1px solid rgba(0, 0, 0, .15); }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); }
  .chip[aria-pressed="false"] { color: var(--muted); }
  .chip[aria-pressed="false"] .dot { opacity: .35; }
  .chip-all { border-style: dashed; }
  .count { white-space: nowrap; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

  /* Escada de pontos */
  .ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .step { background: var(--soft); border-radius: 14px; padding: 10px 8px; text-align: center; display: grid; gap: 2px; }
  .step b { font-family: var(--display); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .step span { font-size: .78rem; color: var(--muted); line-height: 1.25; }

  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px 18px; cursor: pointer;
    font-family: var(--display); font-weight: 600; font-size: 1.05rem;
    background: var(--accent); color: var(--on-accent);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Jogo */
  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .topbar .num { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
  .score { font-variant-numeric: tabular-nums; color: var(--muted); }
  .score b { color: var(--ink); font-family: var(--display); font-size: 1.15rem; }
  .track { display: flex; flex-wrap: wrap; gap: 6px; }
  .pb { width: 18px; height: 18px; border-radius: 32%; border: 1.5px dashed var(--line); }
  .pb.now { border: 2px solid var(--ink); }
  .pb.hit { background: var(--c); border: 1px solid rgba(0, 0, 0, .15); }
  .pb.miss { border: 2.5px solid var(--c); opacity: .7; }

  .clue-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .worth { font-weight: 700; font-size: .85rem; padding: 4px 10px; border-radius: 999px; background: var(--soft); font-variant-numeric: tabular-nums; }
  .emoji { font-size: clamp(2.1rem, 9.5vw, 3.4rem); text-align: center; letter-spacing: .05em; line-height: 1.2; padding-block: 4px; }
  .clues { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .clues li { background: var(--soft); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; animation: slide .3s ease-out both; }
  @keyframes slide { from { transform: translateY(-6px); } }
  .hint { background: transparent; border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-weight: 600; text-align: center; }
  .hint small { display: block; font-weight: 400; color: var(--muted); }
  .hint:hover { border-color: var(--accent); }

  .opts { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 520px) { .opts { grid-template-columns: 1fr 1fr; } }
  .opt {
    text-align: left; cursor: pointer; min-height: 56px; padding: 12px 14px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--surface); font-weight: 600; overflow-wrap: anywhere;
    transition: border-color .15s, transform .1s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
  .opt:disabled { cursor: default; }
  .opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
  .opt.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
  .opt.dim { opacity: .55; }

  .reveal { display: grid; gap: 12px; justify-items: center; text-align: center; padding-top: 4px; }
  .verdict { font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .reveal .bracelet { font-size: clamp(12px, 3.6vw, 16px); }
  .meta { color: var(--muted); font-weight: 600; }
  .fact { justify-self: stretch; text-align: left; background: var(--soft); border-radius: 12px; padding: 12px 14px; }

  /* Fim */
  .final { text-align: center; display: grid; gap: 8px; justify-items: center; }
  .big { font-family: var(--display); font-weight: 700; font-size: clamp(2.8rem, 14vw, 4rem); line-height: 1; font-variant-numeric: tabular-nums; }
  .big small { font-size: .45em; color: var(--muted); font-weight: 500; }
  .record { color: var(--muted); font-size: .9rem; }
  .recap { list-style: none; margin: 0; padding: 0; display: grid; }
  .recap li { display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: center; padding-block: 10px; border-top: 1px solid var(--line); }
  .recap li:first-child { border-top: 0; }
  .recap .t { min-width: 0; overflow-wrap: anywhere; font-weight: 600; line-height: 1.3; }
  .recap .t small { display: block; color: var(--muted); font-weight: 400; }
  .recap .p { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
  .recap .p.zero { color: var(--muted); }
  .recap .sw { width: 16px; height: 16px; border-radius: 32%; background: var(--c); border: 1px solid rgba(0, 0, 0, .15); }
  .note { color: var(--muted); font-size: .85rem; text-align: center; }
  .recap a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .recap a:hover { text-decoration-color: var(--accent); }

  /* Som */
  .soundbar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: .85rem;
    background: var(--surface); border: 1.5px solid var(--line); color: var(--muted);
  }
  .toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .toggle[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--soft); }
  .toggle .off-line { display: none; }
  .toggle[aria-pressed="false"] .off-line { display: inline; }

  .listen { justify-self: stretch; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .listen a {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px;
    font-weight: 700; font-size: .9rem; text-decoration: none; color: var(--ink);
    background: var(--surface); border: 1.5px solid var(--line);
  }
  .listen a:hover { border-color: var(--accent); }
  .listen a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .listen svg { width: 16px; height: 16px; fill: currentColor; }

  @media (prefers-reduced-motion: reduce) {
    .bead, .clues li { animation: none; }
    .opt { transition: none; }
  }
</style>
</head>

        if (i === 0 || i === 8 || i === 10) ins.kick(at, 0.4);
        if (i === 4 || i === 12) ins.clap(at, 0.09);
        if (i % 4 === 3) ins.pluck(b.tri[(i >> 2) % 3] + 12, at, 0.03, 0.2, "square", 2800);
        if (i % 2 === 1) ins.hat(at, 0.015);
      } },
    // 1989: synth-pop oitentista, caixa grandona
    synthpop: { gain: 0.45, bpm: 118, unit: 16, per: 16, bars: [T(41, 60, 65, 69), T(48, 60, 64, 67), T(43, 59, 62, 67), T(45, 60, 64, 69)],
      play(i, b, n, at, d) {
        if (i % 4 === 0) ins.kick(at, 0.45);
        if (i === 4 || i === 12) ins.snare(at, 0.16, 0.22);
        if (i % 2 === 0) {
          ins.bass(b.root - 12 + (i % 4 ? 12 : 0), at, d * 1.8, 0.08, "sawtooth", 700);
          ins.pluck(b.tri[[0, 1, 2, 1][(i / 2) % 4]] + 12, at, 0.028, 0.18, "square", 3800);
        }
        if (i === 0) ins.pad(b.tri, at, d * 16, 0.012, "sawtooth", 1500, 0.1);
        ins.hat(at, i % 2 ? 0.01 : 0.02);
      } },
    // reputation: escuro, 808 grave e chimbal acelerado
    trap: { gain: 0.5, bpm: 76, unit: 16, per: 16, bars: [T(45, 57, 60, 64), T(41, 57, 60, 65), T(43, 55, 59, 62), T(40, 55, 59, 64)],
      play(i, b, n, at, d) {
        if (i === 0 || i === 10) { ins.sub808(b.root - 12, at, i ? d * 5 : d * 9, 0.3); ins.kick(at, 0.35); }
        if (i === 8) { ins.clap(at, 0.11); ins.snare(at, 0.06, 0.2); }
        if (i === 0) ins.pad(b.tri, at, d * 16, 0.014, "sawtooth", 600, 0.3);
        if (n % 2 === 1 && i >= 12) { ins.hat(at, 0.02, 0.03); ins.hat(at + d / 2, 0.015, 0.03); }
        else if (i % 2 === 0) ins.hat(at, 0.022, 0.035);
        if (i === 0 && n % 4 === 0) ins.bell(b.tri[0] + 12, at, 0.025, 2);
      } },
    // Lover: pop sonhador, piano elétrico e estalos de dedo
    dreamy: { gain: 1.55, bpm: 92, unit: 16, per: 16, bars: [T(48, 60, 64, 67, 71), T(45, 60, 64, 67, 69), T(41, 60, 64, 65, 69), T(43, 59, 62, 64, 67)],
      play(i, b, n, at) {
        if (i === 0 || i === 6) ins.epiano(b.tri, at, 0.022, 1.3);
        if (i === 0 || i === 10) ins.bass(b.root, at, 0.5, 0.14);
        if (i === 0 || i === 8) ins.kick(at, 0.22);
        if (i === 4 || i === 12) ins.snap(at, 0.07);
        if (i === 14) ins.bell(b.tri[3] + 12, at, 0.02, 1);
        if (i % 2 === 1) ins.hat(at, 0.008);
      } },
    // folklore: piano calmo, sem bateria
    piano: { gain: 1.35, bpm: 74, unit: 16, per: 16, bars: [T(40, 55, 59, 64), T(36, 55, 60, 64), T(43, 55, 59, 62), T(38, 54, 57, 62)],
      play(i, b, n, at, d) {
        const notes = [...b.tri, b.tri[0] + 12];
        if (i === 0) { ins.piano(b.root, at, 0.09, 2.6); ins.pad(b.tri, at, d * 16, 0.008, "sine", 700, 0.6); }
        if (i % 2 === 0) ins.piano(notes[[0, 1, 2, 3, 2, 1, 2, 1][i / 2]] + 12, at, 0.045, 1.4);
        if (i === 10 && n % 2) ins.piano(b.tri[2] + 24, at, 0.02, 1.2);
      } },
    // evermore: violão dedilhado em 6/8, clima de floresta
    fingerpick: { gain: 1.7, bpm: 84, unit: 8, per: 6, bars: [T(38, 57, 62, 65), T(34, 58, 62, 65), T(41, 57, 60, 65), T(36, 55, 60, 64)],
      play(i, b, n, at, d) {
        const notes = [...b.tri, b.tri[0] + 12], pick = [null, 1, 2, null, 3, 2][i];
        if (i === 0) { ins.pluck(b.root + 12, at, 0.08, 1.2, "triangle", 1600); ins.pad(b.tri, at, d * 6, 0.008, "sine", 700, 0.5); }
        if (i === 3) { ins.pluck(b.root + 19, at, 0.06, 1, "triangle", 1600); ins.hat(at, 0.01, 0.08); }
        if (pick !== null) ins.pluck(notes[pick] + 12, at, 0.04, 0.8, "triangle", 2600);
      } },
    // Midnights: sintetizador noturno pulsante
    night: { gain: 0.8, bpm: 96, unit: 16, per: 16, bars: [T(41, 56, 60, 65), T(37, 56, 61, 65), T(44, 56, 60, 63), T(39, 55, 58, 63)],
      play(i, b, n, at, d) {
        if (i % 4 === 0) { ins.pad(b.tri, at + 0.03, d * 3.6, 0.014, "sawtooth", 1300, 0.1); ins.kick(at, 0.28); }
        if (i % 4 === 2) ins.bass(b.root - 12, at, d * 1.6, 0.1, "sawtooth", 500);
        if (i === 6 && n % 2) ins.bell(b.tri[2] + 24, at, 0.02, 1.4);
        if (i === 12) ins.snap(at, 0.04);
        if (i % 2 === 1) ins.hat(at, 0.01);
      } },
    // The Tortured Poets Department: máquina de escrever e piano abafado
    typewriter: { gain: 1.9, bpm: 100, unit: 16, per: 16, bars: [T(48, 60, 64, 67), T(40, 59, 64, 67), T(45, 60, 64, 69), T(41, 60, 65, 69)],
      play(i, b, n, at) {
        if ([0, 3, 6, 8, 11, 14].includes(i)) ins.tick(at, 0.05);
        if (i === 0 && n % 4 === 0) ins.bell(96, at, 0.025, 0.9);
        if (i === 0 || i === 8) { ins.epiano(b.tri, at, 0.02, 0.9); ins.kick(at, 0.22); }
        if (i === 0 || i === 7 || i === 8) ins.bass(b.root, at, 0.3, 0.12);
        if (i === 4 || i === 12) ins.snare(at, 0.04, 0.1);
      } },
    // The Life of a Showgirl: metais de espetáculo e baixo andante
    showtime: { gain: 0.75, bpm: 124, unit: 16, per: 16, bars: [T(48, 60, 64, 67), T(45, 61, 64, 67), T(50, 62, 65, 69), T(43, 59, 62, 65)],
      play(i, b, n, at, d) {
        if (i % 4 === 0) ins.bass(b.root + [0, 7, 12, 7][i / 4], at, d * 3.5, 0.13, "triangle", 900);
        if (i === 0 || i === 6 || i === 12) ins.brass(b.tri, at, i === 12 ? 0.3 : 0.16, 0.03);
        if (i === 0 || i === 8) ins.kick(at, 0.35);
        if (i === 4 || i === 12) ins.clap(at, 0.09);
        if (i % 2 === 0) ins.hat(at, 0.014);
        if (i === 15 && n % 4 === 3) ins.bell(b.tri[0] + 24, at, 0.03, 1);
      } },
  };
  const ERA_STYLE = {
    "Taylor Swift": "country", "Fearless": "banjo", "Speak Now": "waltz", "Red": "drive", "1989": "synthpop",
    "reputation": "trap", "Lover": "dreamy", "folklore": "piano", "evermore": "fingerpick", "Midnights": "night",
    "The Tortured Poets Department": "typewriter", "The Life of a Showgirl": "showtime",
  };

  function tick() {
    const st = STYLES[style], d = 60 / st.bpm / (st.unit === 8 ? 2 : 4);
    while (nextAt < ctx.currentTime + 0.15) {
      const n = Math.floor(step / st.per);
      st.play(step % st.per, st.bars[n % st.bars.length], n, nextAt, d);
      nextAt += d; step++;
    }
  }
  function fadeIn(secs) {
    const now = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(now);
    musicBus.gain.setValueAtTime(0.0001, now);
    musicBus.gain.exponentialRampToValueAtTime(0.8 * STYLES[style].gain, now + secs);
  }
  function startMusic() {
    if (!prefs.music || !init() || timer) return;
    ctx.resume();
    style = target; step = 0; nextAt = ctx.currentTime + 0.1;
    fadeIn(1.2);
    timer = setInterval(tick, 25); tick();
  }
  function stopMusic() {
    if (!ctx || !timer) return;
    clearInterval(timer); timer = null;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(musicBus.gain.value, ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
  }
  // Troca de trilha com um fade curto: abaixa, troca o estilo, volta.
  function setStyle(name) {
    if (!STYLES[name] || name === target) return;
    target = name;
    if (!timer) return;
    const now = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(now);
    musicBus.gain.setValueAtTime(Math.max(musicBus.gain.value, 0.0001), now);
    musicBus.gain.linearRampToValueAtTime(0.0001, now + 0.3);
    clearTimeout(switching);
    switching = setTimeout(() => {
      switching = null;
      if (!timer) return;
      style = target; step = 0; nextAt = ctx.currentTime + 0.05;
      fadeIn(0.5);
    }, 350);
  }

  // Prévia sob demanda: toca a trilha de uma era por alguns segundos, mesmo com a música de fundo desligada.
  let previewTimer = null;
  function preview(album, secs, onEnd) {
    if (!init()) return false;
    ctx.resume();
    clearTimeout(previewTimer); clearTimeout(switching); switching = null;
    if (timer) { clearInterval(timer); timer = null; }
    style = target = ERA_STYLE[album] || "menu"; step = 0; nextAt = ctx.currentTime + 0.05;
    fadeIn(0.3);
    timer = setInterval(tick, 25); tick();
    previewTimer = setTimeout(() => { stopMusic(); if (onEnd) onEnd(); }, secs * 1000);
    return true;
  }
  function stopPreview() { clearTimeout(previewTimer); stopMusic(); }

  const sfx = fn => { if (prefs.sfx && init()) { ctx.resume(); fn(ctx.currentTime + 0.01); } };
  const PENTA = [72, 74, 76, 79, 81, 84, 86, 88];
  const fx = (n, at, dur, vol, type = "triangle", cutoff) => voice({ freq: midi(n), type, at, dur, vol, cutoff, bus: sfxBus });

  return {
    prefs,
    unlock() { if ((prefs.music || prefs.sfx) && init()) ctx.resume(); },
    startMusic,
    setStyle,
    preview,
    stopPreview,
    styleForAlbum: album => ERA_STYLE[album] || "menu",
    setMusic(on) { prefs.music = on; store.set("adivinhe-musica", on); on ? startMusic() : stopMusic(); },
    setSfx(on) { prefs.sfx = on; store.set("adivinhe-efeitos", on); if (ctx) sfxBus.gain.value = on ? 1 : 0; },
    hint: () => sfx(t => fx(79, t, 0.18, 0.12)),
    correct: () => sfx(t => [76, 81, 88].forEach((n, k) => fx(n, t + k * 0.09, 0.35, 0.16))),
    wrong: () => sfx(t => [55, 50].forEach((n, k) => fx(n, t + k * 0.16, 0.3, 0.06, "sawtooth", 900))),
    beads: count => sfx(t => { for (let k = 0; k < Math.min(count, 28); k++) fx(PENTA[(k * 3) % PENTA.length] + 12, t + 0.12 + k * 0.035, 0.07, 0.05, "sine"); }),
    fanfare: good => sfx(t => (good ? [60, 64, 67, 72, 76] : [60, 64, 67]).forEach((n, k) => fx(n + 12, t + k * 0.12, 0.5, 0.14))),
  };
})();


const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const spotifyUrl = title => `https://open.spotify.com/search/${encodeURIComponent(`${title} Taylor Swift`)}`;
const youtubeUrl = title => `https://www.youtube.com/results?search_query=${encodeURIComponent(`Taylor Swift ${title}`)}`;

// Contas com letras: cada palavra fica junta numa "pulseira", as palavras quebram de linha entre si.
function bracelet(text, colorFor) {
  let d = 0;
  return text.toUpperCase().split(/\s+/).filter(Boolean).map((word, w) =>
    `<span class="word">${[...word].map(ch =>
      `<span class="bead" style="${colorVars(colorFor(w, d))};--d:${d++}">${esc(ch)}</span>`).join("")}</span>`
  ).join("");
}

const savedEras = store.get("adivinhe-eras", null);
let state = {
  screen: "start",
  eras: Array.isArray(savedEras) && savedEras.some(a => ERAS.some(e => e.album === a)) ? savedEras.filter(a => ERAS.some(e => e.album === a)) : ERAS.map(e => e.album),
  deck: [], i: 0, score: 0, shown: 0, picked: null, results: [],
};

const songBy = title => SONGS.find(s => s.title === title);
const pool = () => SONGS.filter(s => state.eras.includes(s.album));

function makeOptions(song) {
  const others = SONGS.filter(s => s.title !== song.title);
  const same = shuffle(others.filter(s => s.album === song.album)).slice(0, 1);
  const rest = shuffle(others.filter(s => !same.includes(s))).slice(0, 3 - same.length);
  return shuffle([song, ...same, ...rest].map(s => s.title));
}

function startRound() {
  const picked = shuffle(pool()).slice(0, ROUND);
  if (!picked.length) return;
  store.set("adivinhe-eras", state.eras);
  state = { ...state, screen: "game", deck: picked.map(s => ({ title: s.title, options: makeOptions(s) })), i: 0, score: 0, shown: 0, picked: null, results: [] };
  render();
  window.scrollTo({ top: 0 });
}

function renderHero() {
  const colors = ERAS.map(e => e.color);
  document.getElementById("hero").innerHTML = bracelet("Adivinhe a música", (w, d) => colors[(d + w * 2) % colors.length]);
}

function renderStart() {
  const n = pool().length;
  const all = state.eras.length === ERAS.length;
  $app.innerHTML = `
    <div class="stack">
      <p class="tagline">Descubra a música da Taylor pelos emojis. Ficou difícil? Peça uma dica. Quanto menos dicas você usar, mais pontos ganha.</p>
      <section class="panel" aria-labelledby="eras-t">
        <div class="clue-head">
          <h2 id="eras-t">Quais eras entram na rodada?</h2>
          <span class="count">${n} música${n === 1 ? "" : "s"}</span>
        </div>
        <div class="chips">
          <button class="chip chip-all" data-action="all" aria-pressed="${all}">Todas</button>
          ${ERAS.map(e => `<button class="chip" data-action="era" data-album="${esc(e.album)}" aria-pressed="${state.eras.includes(e.album)}" style="${colorVars(e.color)}"><span class="dot"></span>${esc(e.label)}</button>`).join("")}
        </div>
      </section>
      <section class="panel" aria-labelledby="pts-t">
        <h2 id="pts-t">Como funciona a pontuação</h2>
        <div class="ladder">
          <div class="step"><b>4</b><span>só com os emojis</span></div>
          <div class="step"><b>3</b><span>com 1 dica</span></div>
          <div class="step"><b>2</b><span>com 2 dicas</span></div>
          <div class="step"><b>1</b><span>com 3 dicas</span></div>
        </div>
        <button class="btn" data-action="start" ${n ? "" : "disabled"}>${n ? `Começar rodada com ${Math.min(ROUND, n)} músicas` : "Escolha pelo menos uma era"}</button>
      </section>
      <p class="note">As dicas falam da história, do clipe e de curiosidades. Nenhuma letra de música é usada. A trilha de fundo é original e muda conforme a era da música da vez (ela também é uma pista!). Depois de cada resposta você pode ouvir a música de verdade no Spotify ou no YouTube.</p>
    </div>`;
}

function trackHTML() {
  return state.deck.map((item, k) => {
    const c = eraOf(songBy(item.title).album).color;
    const res = state.results[k];
    const cls = res ? (res.pts ? "hit" : "miss") : (k === state.i ? "now" : "");
    return `<span class="pb ${cls}" style="${colorVars(c)}" title="Música ${k + 1}"></span>`;
  }).join("");
}

function renderGame() {
  const item = state.deck[state.i];
  const song = songBy(item.title);
  const done = state.picked !== null;
  const worth = MAX_PER_SONG - state.shown;
  const hit = done && state.picked === song.title;
  const era = eraOf(song.album);
  const isLast = state.i + 1 >= state.deck.length;

  $app.innerHTML = `
    <div class="stack">
      <div class="topbar">
        <span class="num">Música ${state.i + 1} de ${state.deck.length}</span>
        <span class="score"><b>${state.score}</b> ponto${state.score === 1 ? "" : "s"}</span>
      </div>
      <div class="track" aria-label="Progresso da rodada">${trackHTML()}</div>
      <section class="panel" aria-live="polite">
        <div class="clue-head">
          <span class="label">Que música é essa?</span>
          ${done ? "" : `<span class="worth">Vale ${worth} ponto${worth === 1 ? "" : "s"}</span>`}
        </div>
        <div class="emoji" role="img" aria-label="Pista em emojis">${esc(song.emoji)}</div>
        ${state.shown ? `<ol class="clues">${song.clues.slice(0, state.shown).map((c, k) => `<li><span class="label">Dica ${k + 1}</span>${esc(c)}</li>`).join("")}</ol>` : ""}
        ${!done && state.shown < song.clues.length ? `<button class="hint" data-action="hint">Mostrar dica ${state.shown + 1} de ${song.clues.length}<small>a música passa a valer ${worth - 1} ponto${worth - 1 === 1 ? "" : "s"}</small></button>` : ""}
        <div class="opts">
          ${item.options.map(t => {
            let cls = "";
            if (done) cls = t === song.title ? "ok" : t === state.picked ? "bad" : "dim";
            return `<button class="opt ${cls}" data-action="pick" data-title="${esc(t)}" ${done ? "disabled" : ""}>${esc(t)}</button>`;
          }).join("")}
        </div>
        ${done ? `
          <div class="reveal">
            <p class="verdict ${hit ? "ok" : "bad"}">${hit ? `Acertou! +${state.results[state.i].pts} ponto${state.results[state.i].pts === 1 ? "" : "s"}` : "Não foi dessa vez. Era esta:"}</p>
            <div class="bracelet">${bracelet(song.title, () => era.color)}</div>
            <p class="meta">${esc(song.album)} · ${song.year}</p>
            <div class="listen">
              <a href="${spotifyUrl(song.title)}" target="_blank" rel="noopener">${ICON_PLAY}Ouvir no Spotify</a>
              <a href="${youtubeUrl(song.title)}" target="_blank" rel="noopener">${ICON_PLAY}Ver no YouTube</a>
            </div>
            <p class="fact"><span class="label">Curiosidade</span><br>${esc(song.fact)}</p>
            <button class="btn" data-action="next">${isLast ? "Ver resultado" : "Próxima música"}</button>
          </div>` : ""}
      </section>
    </div>`;
  if (done) $app.querySelector('[data-action="next"]').focus({ preventScroll: true });
}

function verdictFor(pct) {
  if (pct === 1) return "Placar perfeito! Você reconhece qualquer era só pelos emojis.";
  if (pct >= .75) return "Swiftie de carteirinha. Quase nada escapa de você.";
  if (pct >= .5) return "Mandou bem! Mais umas maratonas da discografia e você chega ao topo.";
  if (pct >= .25) return "Deu para o gasto. Que tal ouvir os álbuns de novo e tentar outra rodada?";
  return "Começo de era! Bora mais uma rodada?";
}

function renderEnd() {
  const max = state.deck.length * MAX_PER_SONG;
  const best = store.get("adivinhe-recorde", null);
  const hits = state.results.filter(r => r.pts).length;
  $app.innerHTML = `
    <div class="stack">
      <section class="panel final">
        <span class="label">Resultado</span>
        <div class="big">${state.score}<small> / ${max}</small></div>
        <p>Você acertou ${hits} de ${state.deck.length} músicas. ${verdictFor(state.score / max)}</p>
        <div class="track" style="justify-content:center">${trackHTML()}</div>
        ${best ? `<p class="record">Seu recorde: ${best.score} de ${best.max} pontos${state.newRecord ? " (novo recorde!)" : ""}</p>` : ""}
      </section>
      <section class="panel">
        <h2>As músicas da rodada</h2>
        <ul class="recap">
          ${state.results.map(r => {
            const s = songBy(r.title);
            return `<li><span class="sw" style="${colorVars(eraOf(s.album).color)}"></span><span class="t"><a href="${spotifyUrl(s.title)}" target="_blank" rel="noopener" title="Ouvir no Spotify">${esc(s.title)}</a><small>${esc(s.album)} · ${s.year}</small></span><span class="p ${r.pts ? "" : "zero"}">${r.pts ? `+${r.pts}` : "0"}</span></li>`;
          }).join("")}
        </ul>
      </section>
      <div class="row">
        <button class="btn ghost" data-action="menu">Trocar eras</button>
        <button class="btn" data-action="start">Jogar de novo</button>
      </div>
    </div>`;
}

function render() {
  const inGame = state.screen === "game" && state.deck[state.i] && songBy(state.deck[state.i].title);
  Sound.setStyle(inGame ? Sound.styleForAlbum(songBy(state.deck[state.i].title).album) : "menu");
  if (state.screen === "game" && state.deck.length && state.deck.every(d => songBy(d.title))) renderGame();
  else if (state.screen === "end" && state.results.every(r => songBy(r.title))) renderEnd();
  else { state.screen = "start"; renderStart(); }
}

$app.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const action = el.dataset.action;
  Sound.unlock();
  if (action === "era") {
    const a = el.dataset.album;
    state.eras = state.eras.includes(a) ? state.eras.filter(x => x !== a) : [...state.eras, a];
    render();
  } else if (action === "all") {
    state.eras = state.eras.length === ERAS.length ? [] : ERAS.map(e => e.album);
    render();
  } else if (action === "start") {
    startRound();
    Sound.startMusic();
  } else if (action === "menu") {
    state.screen = "start"; render();
  } else if (action === "hint") {
    state.shown = Math.min(state.shown + 1, songBy(state.deck[state.i].title).clues.length);
    Sound.hint();
    render();
  } else if (action === "pick") {
    if (state.picked !== null) return;
    const song = songBy(state.deck[state.i].title);
    state.picked = el.dataset.title;
    const pts = state.picked === song.title ? MAX_PER_SONG - state.shown : 0;
    state.score += pts;
    state.results.push({ title: song.title, pts });
    pts ? Sound.correct() : Sound.wrong();
    Sound.beads(song.title.replace(/\s+/g, "").length);
    render();
  } else if (action === "next") {
    state.i++; state.shown = 0; state.picked = null;
    if (state.i >= state.deck.length) {
      const max = state.deck.length * MAX_PER_SONG;
      const best = store.get("adivinhe-recorde", null);
      state.newRecord = !best || state.score / max > best.score / best.max;
      if (state.newRecord) store.set("adivinhe-recorde", { score: state.score, max });
      state.screen = "end";
      Sound.fanfare(state.score / max >= 0.5);
    }
    render();
    window.scrollTo({ top: 0 });
  }
});

function syncToggles() {
  document.getElementById("musicToggle").setAttribute("aria-pressed", Sound.prefs.music);
  document.getElementById("sfxToggle").setAttribute("aria-pressed", Sound.prefs.sfx);
}
document.getElementById("musicToggle").addEventListener("click", () => { Sound.setMusic(!Sound.prefs.music); syncToggles(); });
document.getElementById("sfxToggle").addEventListener("click", () => { Sound.setSfx(!Sound.prefs.sfx); syncToggles(); });
syncToggles();

window.claude?.hot?.snapshot?.(() => state);
function boot(data) {
  if (data && typeof data === "object" && data.screen) state = { ...state, ...data };
  renderHero();
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
